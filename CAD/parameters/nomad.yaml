solar:
  SOLAR_CASSETTE_WIDTH:     { value: null, status: TBD, source: "Bounded by lid width (two side by side)", formula: "(BODY_WIDTH - 2 * WALL_THICKNESS - MIN_GAP) / 2" }
  SOLAR_CASSETTE_HEIGHT:    { value: null, status: TBD, source: "Bounded by lid height", working: 200 }
  SOLAR_CASSETTE_THICKNESS: { value: null, status: TBD, source: "Panel + frame; panel not selected", working: 8 }
  SOLAR_ROTATION_LIMIT:     { value: { min: 60, max: 75 }, unit: deg, status: provisional, source: "D-004 target range, +/- about the rotation axis" }
  SOLAR_ROTATION_AXIS:      { value: slide_direction, unit: none, status: provisional, source: "D-004: approximately along the slide/deployment direction; exact axis geometry subject to P0.1 validation" }
  SOLAR_DEPLOY_CLEARANCE:   { value: null, status: TBD, source: "Cassette inboard edge to lid side wall when fully deployed", working: 5 }
  SOLAR_SLIDE_TRAVEL:       { value: null, status: TBD, source: "D-004: lateral outward deployment from the lid", formula: "SOLAR_CASSETTE_WIDTH + WALL_THICKNESS + SOLAR_DEPLOY_CLEARANCE" }
  SOLAR_RAIL_ENGAGEMENT:    { value: null, status: TBD, source: "Carriage length retained in the rail at full deployment", working: 40 }
  SOLAR_HUB_AXIS_OFFSET_Y:  { value: null, status: TBD, source: "Hub axis position across the cassette height (not a decision; D-004)", formula: "SOLAR_CASSETTE_HEIGHT / 2" }
  SOLAR_HUB_AXIS_OFFSET_Z:  { value: null, status: TBD, source: "Hub axis position through the cassette thickness (not a decision; D-004)", formula: "SOLAR_CASSETTE_THICKNESS / 2" }
  SOLAR_INDEX_STEP:         { value: null, unit: deg, status: TBD, source: "D-004: discrete indexed positions with a positive lock", working: 15 }
  SOLAR_HUB_PIN_DIAMETER:   { value: null, status: TBD, source: "D-004: dedicated hub/pin carries the rotational load (metal pin)", working: 5 }

battery:
