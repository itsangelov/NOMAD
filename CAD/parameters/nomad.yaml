  PI_DEPTH:                { value: 56, status: provisional, source: "Raspberry Pi 5 board outline, approximate" }
  PI_STACK_HEIGHT:         { value: null, status: TBD, source: "Pi + M.2 HAT+ + GNSS pHAT + cooler" }
