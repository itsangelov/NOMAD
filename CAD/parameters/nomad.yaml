# NOMAD mechanical parameters: machine-readable source of truth (D-002).
# docs/mechanical-spec.md is the human-readable spec and must agree with this file.
# FeatureScript values are derived from this file and never edited as the master.
#
# SCHEMA (per parameter)
#   AUTHORITATIVE fields: the only engineering values in this file.
#     value    Authoritative value. null = TBD (no engineering value exists yet).
#     status   Status of `value`: verified | derived | provisional | TBD.
#              status TBD  <=>  value null.
#     source   What `value` comes from, or what will drive it.
#     unit     mm (default) | deg | none.
#   WORKING fields: P0.1 working inputs, NOT engineering values.
#     working  Provisional placeholder number, used only to build P0.1 envelope geometry
#              while `value` is null. Never a decision or a verified dimension.
#     formula  Provisional expression over other parameters (+ - * / and parentheses).
#              Its result has exactly the same standing as `working`.
#   INFORMATIONAL fields (never used for geometry): reference, intent, limit, note.
#
# RESOLUTION for geometry (CAD/tools/yaml_to_featurescript.py):
#   value (if not null)  ->  formula  ->  working  ->  unresolved (no geometry may use it).
#   The generator labels every emitted constant with the field it came from.
#
# FORMAT: restricted YAML subset (comments, two-level block mappings, inline flow maps/lists,
#   double-quoted strings, numbers, null/true/false, bare words). The generator rejects anything else.

