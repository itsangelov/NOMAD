# NOMAD mechanical parameters: machine-readable source of truth (D-002).
# docs/mechanical-spec.md is the human-readable spec and must agree with this file.
#
# REVISION: Virtual V1 (2026-10-06). This file describes the CURRENT Virtual V1 only (architecture B1, D-010).
#   - The P0.1 / Round C / Round E / Architecture A parameter set (sliding solar cassettes, class-A lid, rear port
#     panels, D-009 index lock) is FROZEN, unchanged, in CAD/parameters/history/nomad_P0.1_2026-10-02.yaml.
#     The P0.1 FeatureScript files (NOMAD_P01.fs, NOMAD_E_Prototype.fs) and every P0.1 study script read that
#     snapshot, so their reports still reproduce. Nothing historical was deleted.
#   - Integration model and checks for this file: CAD/tools/v1_integration.py. Hardware data: prototypes/V1/v1_hardware.py.
#   - No FeatureScript is generated from this file yet (no V1 production CAD exists; see docs/V1-VIRTUAL-INTEGRATION.md).
#
# SCHEMA (per parameter)
#   AUTHORITATIVE fields: the only engineering values in this file.
#     value    Authoritative value. null = TBD (no engineering value exists yet).
#     status   Status of `value`: verified | derived | provisional | TBD.
#              provisional = chosen or taken from candidate hardware data; NOT physically verified.
#              status TBD  <=>  value null.
#     source   What `value` comes from, or what will drive it.
#     unit     mm (default) | deg | none.
#   WORKING fields (only while value is null): provisional numbers used to build the V1 envelope model.
#     working  Placeholder number. Never a decision or a verified dimension.
#     formula  Expression over other parameters (+ - * / and parentheses). Same standing as `working`:
#              a derived working value that follows its inputs.
#   INFORMATIONAL fields (never used for geometry): reference, intent, limit, note.
#
# RESOLUTION (CAD/tools/yaml_to_featurescript.py resolve()): value -> formula -> working -> unresolved.
# FORMAT: restricted YAML subset (comments, two-level block mappings, inline flow maps/lists,
#   double-quoted strings, numbers, null/true/false, bare words). The parser rejects anything else.
# Nothing in this file is physically measured. Every hardware value is from candidate-part documentation.

