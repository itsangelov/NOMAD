  TRACKPAD_LATERAL_OFFSET: { value: null, status: TBD, source: "D-003", intent: "0 = centred on chassis longitudinal centreline", working: 0 }
  TRACKPAD_KEYBOARD_GAP:   { value: null, status: TBD, source: "D-003; trackpad sits below keyboard", working: 10 }

computer:
